spring:
  application:
    name: foodloop-backend

  # ── Datasource (TiDB / MySQL) ─────────────────────
  datasource:
    url: jdbc:mysql://${FOODLOOP_DB_HOST:localhost}:${FOODLOOP_DB_PORT:3306}/${FOODLOOP_DB_NAME:foodloop}?sslMode=${FOODLOOP_DB_SSL_MODE:VERIFY_IDENTITY}&serverTimezone=UTC
    username: ${FOODLOOP_DB_USERNAME:foodloop_user}
    password: ${FOODLOOP_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # ── JPA / Hibernate ───────────────────────────────
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  # ── Flyway ────────────────────────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

# ── Server ──────────────────────────────────────────
server:
  port: ${PORT:8080}

# ── App-specific ────────────────────────────────────
foodloop:
  jwt:
    secret: ${FOODLOOP_JWT_SECRET:}
    expiration-ms: ${FOODLOOP_JWT_EXPIRATION_MS:86400000}
  resend:
    api-key: ${RESEND_API_KEY:}
    from-email: ${RESEND_FROM_EMAIL:onboarding@resend.dev}
  mail:
    feedback-to: ${FOODLOOP_FEEDBACK_TO:harshitsinghh1128@gmail.com}
  frontend:
    url: ${FOODLOOP_FRONTEND_URL:http://localhost:3000}
  verification:
    token-expiry-hours: 24
    resend-cooldown-seconds: 60
  dev:
    log-verification-link: ${FOODLOOP_DEV_LOG_VERIFICATION_LINK:false}
